name: Feature request
description: Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@imatomix/mixer"
        - "@imatomix/mix-router"
        - "@imatomix/mix-cors"
        - "@imatomix/mix-static"
        - "@imatomix/mix-session"
        - "@imatomix/mix-logger"
        - New package
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like it to work? A code example of the API you have in mind helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
