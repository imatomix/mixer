name: PR title

# Kept separate from ci.yml so that editing a PR title re-runs only this
# check instead of the whole test suite.
on:
  pull_request:
    branches: [main, web-standard]
    types: [opened, edited, synchronize, reopened]

# Pull requests from forks run with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The title is passed through the environment, never interpolated into the script.
      - run: node scripts/check-pr-title.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
